<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fulfillment Daily Checklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #18262c;
      --ink-2: #3f5159;
      --muted: #6f7f85;
      --faint: #93a1a6;
      --line: #e4e8e6;
      --line-2: #d7ddda;
      --panel: #ffffff;
      --bg: #eceeec;
      --brand: #172d3a;
      --brand-2: #21404f;
      --primary: #172d3a;
      --green: #2f7a56;
      --green-deep: #246245;
      --green-soft: #edf5f0;
      --green-line: #cfe5d8;
      --info-bg: #f1f4f6;
      --info-line: #dde4e8;
      --radius: 12px;
      --radius-sm: 9px;
      --shadow-sm: 0 1px 2px rgba(20, 38, 44, 0.05);
      --shadow: 0 6px 22px rgba(20, 38, 44, 0.07), 0 1px 2px rgba(20, 38, 44, 0.05);
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(1200px 480px at 100% -10%, rgba(23, 45, 58, 0.05), transparent 60%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; color: inherit; }

    /* ---------- header ---------- */
    header {
      background: linear-gradient(180deg, #1b3543, var(--brand));
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-inner {
      display: flex; gap: 24px; align-items: center; justify-content: space-between;
      max-width: 1200px; margin: 0 auto; padding: 20px 28px;
    }

    .brand-lockup { display: flex; gap: 20px; align-items: center; min-width: 0; }

    .brand-logo {
      display: block; width: 186px; height: auto;
      background: #fff; border-radius: 10px; padding: 8px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .brand-divider { width: 1px; align-self: stretch; background: rgba(255, 255, 255, 0.16); }

    .brand-title { display: grid; gap: 5px; min-width: 0; }

    .eyebrow {
      font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase; color: #9fc7b4;
    }

    h1 { margin: 0; font-size: 25px; line-height: 1.12; font-weight: 600; letter-spacing: -0.01em; }

    .clock {
      min-width: 240px; padding: 11px 16px;
      border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 10px;
      background: rgba(255, 255, 255, 0.06); text-align: right;
    }

    .clock strong { display: block; font-size: 15px; font-weight: 600; line-height: 1.3; }

    .clock span {
      display: block; margin-top: 2px;
      font-family: "IBM Plex Mono", monospace; font-size: 12.5px;
      letter-spacing: 0.02em; color: rgba(255, 255, 255, 0.7);
    }

    /* ---------- layout ---------- */
    main {
      display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px;
      max-width: 1200px; margin: 26px auto; padding: 0 28px 40px;
    }

    .workspace { display: grid; gap: 18px; }

    .panel, .sidebar {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }

    .panel { overflow: hidden; }

    .panel-title, .sidebar-title {
      display: flex; gap: 12px; align-items: center; justify-content: space-between;
      padding: 15px 20px; border-bottom: 1px solid var(--line);
    }

    h2 { margin: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -0.005em; }
    h3 { margin: 0; font-size: 14px; font-weight: 600; }

    .count-tag {
      font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 500;
      color: var(--muted); white-space: nowrap;
    }

    /* ---------- segmented tabs ---------- */
    .tabs {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;
      padding: 4px; background: #e6ebe8; border: 1px solid var(--line);
      border-radius: 11px;
    }

    .tab-button {
      min-height: 40px; border: 1px solid transparent; border-radius: 8px;
      background: transparent; color: var(--ink-2); cursor: pointer;
      font-size: 14px; font-weight: 600; letter-spacing: -0.005em;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .tab-button:hover { color: var(--ink); }

    .tab-button.active {
      background: var(--panel); color: var(--brand);
      box-shadow: var(--shadow-sm); border-color: var(--line);
    }

    /* ---------- form fields ---------- */
    .meta-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 20px; }

    label { display: grid; gap: 7px; color: var(--muted); }

    .field-label {
      font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }

    input, select, textarea {
      width: 100%; min-height: 42px; border: 1px solid var(--line-2);
      border-radius: var(--radius-sm); color: var(--ink); background: #fff;
      padding: 10px 12px; font-size: 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--brand-2);
      box-shadow: 0 0 0 3px rgba(33, 64, 79, 0.12);
    }

    input[readonly] { background: #f3f5f4; color: var(--ink-2); cursor: default; }

    textarea { min-height: 88px; resize: vertical; line-height: 1.5; }

    select {
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236f7f85' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat; background-position: right 12px center; padding-right: 36px;
    }

    /* ---------- checklist ---------- */
    .checklist { display: grid; gap: 0; }

    .task {
      display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 14px;
      align-items: start; padding: 14px 20px; border-top: 1px solid var(--line);
      cursor: pointer; transition: background 0.12s ease;
    }

    .task:hover { background: #f7faf8; }

    .task input[type="checkbox"] {
      width: 20px; min-height: 20px; height: 20px; margin: 1px 0 0; padding: 0;
      accent-color: var(--green); cursor: pointer;
    }

    .task-body { display: grid; gap: 3px; min-width: 0; }
    .task-title { color: var(--ink); font-weight: 600; font-size: 14px; line-height: 1.4; }
    .task-detail { color: var(--muted); font-size: 12.5px; line-height: 1.45; }

    .task-cat {
      display: inline-block; margin-right: 8px; vertical-align: 1px;
      font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2);
      background: #eef1ef; border: 1px solid var(--line); border-radius: 5px;
      padding: 2px 6px;
    }

    .status-pill {
      justify-self: end; align-self: center;
      font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      border-radius: 999px; border: 1px solid var(--line-2);
      padding: 5px 11px; color: var(--faint); background: #f4f6f5; white-space: nowrap;
    }

    .task.done { background: #f6faf7; }
    .task.done .status-pill { color: #fff; border-color: var(--green-deep); background: var(--green); }
    .task.done .task-title { color: var(--green-deep); }

    /* ---------- actions ---------- */
    .actions {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 18px 20px; border-top: 1px solid var(--line);
    }

    .actions button {
      min-height: 42px; border: 1px solid transparent; border-radius: var(--radius-sm);
      padding: 10px 18px; cursor: pointer; font-size: 14px; font-weight: 600;
      letter-spacing: -0.005em; transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
    }

    .actions button:active { transform: translateY(1px); }

    .primary { color: #fff; background: var(--primary); }
    .primary:hover { background: var(--brand-2); }

    .secondary { color: var(--ink); border-color: var(--line-2); background: #fff; }
    .secondary:hover { background: #f5f7f6; border-color: var(--brand-2); }

    .ghost { color: var(--muted); border-color: transparent; background: transparent; }
    .ghost:hover { color: var(--ink); background: #f1f3f2; }

    button:disabled { cursor: not-allowed; opacity: 0.5; }

    /* ---------- sidebar ---------- */
    .sidebar { align-self: start; overflow: hidden; position: sticky; top: 22px; }

    .side-section { display: grid; gap: 13px; padding: 18px 20px; border-top: 1px solid var(--line); }

    .progress-wrap { display: grid; gap: 10px; }
    .progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .progress-pct { font-family: "IBM Plex Mono", monospace; font-size: 22px; font-weight: 600; color: var(--brand); line-height: 1; }
    .progress-bar { height: 8px; overflow: hidden; border-radius: 999px; background: #e7ebe9; }
    .progress-fill { width: 0%; height: 100%; border-radius: inherit; background: var(--green); transition: width 0.25s ease; }
    .progress-text, .small { color: var(--muted); font-size: 12.5px; line-height: 1.45; }

    .notice {
      border: 1px solid var(--info-line); border-left: 3px solid var(--faint);
      background: var(--info-bg); padding: 11px 13px; border-radius: 8px;
      color: var(--ink-2); font-size: 12.5px; line-height: 1.45;
    }

    .notice.success {
      border-color: var(--green-line); border-left-color: var(--green);
      background: var(--green-soft); color: var(--green-deep);
    }

    .history-list { display: grid; gap: 8px; max-height: 320px; overflow: auto; }

    .history-item {
      border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px;
      background: #fafbfb; font-size: 12.5px; color: var(--ink-2); line-height: 1.5;
    }

    .history-item strong {
      display: block; margin-bottom: 4px; color: var(--ink); font-weight: 600;
      font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: 0.01em;
    }

    .hidden { display: none !important; }

    @media (max-width: 940px) {
      main { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .header-inner { flex-direction: column; align-items: stretch; }
      .brand-lockup { align-items: flex-start; }
      .clock { min-width: 0; text-align: left; }
      .meta-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .brand-lockup { flex-direction: column; }
      .brand-divider { display: none; }
      .task { grid-template-columns: 24px minmax(0, 1fr); }
      .status-pill { grid-column: 2; justify-self: start; margin-top: 2px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand-lockup">
        <svg class="brand-logo" viewBox="0 0 760 190" role="img" aria-labelledby="logoTitle logoDesc">
          <title id="logoTitle">ScriptStation</title>
          <desc id="logoDesc">ScriptStation Intelligent Automation logo</desc>
          <rect x="24" y="28" width="130" height="130" rx="26" fill="#172d3a"></rect>
          <path d="M58 72 L88 98 L58 124" fill="none" stroke="#b8d9a9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M99 118 H130" fill="none" stroke="#dde77d" stroke-width="10" stroke-linecap="round"></path>
          <text x="205" y="105" fill="#172d3a" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="54" font-weight="700">ScriptStation</text>
          <text x="207" y="142" fill="#61717d" font-family="'IBM Plex Mono', monospace" font-size="17" font-weight="500" letter-spacing="9">INTELLIGENT AUTOMATION</text>
        </svg>
        <div class="brand-divider"></div>
        <div class="brand-title">
          <div class="eyebrow">Daily Operations</div>
          <h1>Fulfillment Daily Checklist</h1>
        </div>
      </div>
      <div class="clock" aria-live="polite">
        <strong id="clockDate">Loading date</strong>
        <span id="clockTime">Loading time</span>
      </div>
    </div>
  </header>

  <main>
    <section class="workspace" aria-label="Checklist workspace">
      <form id="checklistForm">
        <div class="tabs" role="tablist" aria-label="Checklist type">
          <button class="tab-button active" id="morningTab" type="button" role="tab" aria-selected="true" data-checklist="morning">Morning Checklist</button>
          <button class="tab-button" id="cleaningTab" type="button" role="tab" aria-selected="false" data-checklist="cleaning">Daily Cleaning</button>
        </div>

        <section class="panel" aria-labelledby="teamInfoTitle">
          <div class="panel-title">
            <h2 id="teamInfoTitle">Shift Details</h2>
          </div>
          <div class="meta-grid">
            <label>
              <span class="field-label">Team member</span>
              <input id="teamMember" name="teamMember" autocomplete="name" placeholder="Full name" required>
            </label>
            <label>
              <span class="field-label">Station</span>
              <input id="station" name="station" value="Fulfillment" readonly required>
            </label>
            <label>
              <span class="field-label">Shift</span>
              <select id="shift" name="shift" required>
                <option>Morning</option>
                <option>Midday</option>
                <option>Closing</option>
              </select>
            </label>
          </div>
        </section>

        <section class="panel" aria-labelledby="morningTitle" data-checklist-section="morning">
          <div class="panel-title">
            <h2 id="morningTitle">Morning Product Checklist</h2>
            <span class="count-tag" id="morningCount">0 complete</span>
          </div>
          <div class="checklist" id="morningTasks"></div>
        </section>

        <section class="panel hidden" aria-labelledby="cleaningTitle" data-checklist-section="cleaning">
          <div class="panel-title">
            <h2 id="cleaningTitle">End-of-Day Cleaning</h2>
            <span class="count-tag" id="cleaningCount">0 complete</span>
          </div>
          <div class="checklist" id="cleaningTasks"></div>
        </section>

        <section class="panel" aria-labelledby="notesTitle">
          <div class="panel-title">
            <h2 id="notesTitle">Notes</h2>
          </div>
          <div class="meta-grid" style="grid-template-columns: 1fr;">
            <label>
              <span class="field-label">Issues, missing supplies, or handoff notes</span>
              <textarea id="notes" name="notes" placeholder="Optional"></textarea>
            </label>
          </div>
          <div class="actions">
            <button class="primary" id="submitButton" type="submit">Submit Morning Checklist</button>
            <button class="secondary" id="saveDraftButton" type="button">Save Draft</button>
            <button class="ghost" id="resetButton" type="button">Reset</button>
          </div>
        </section>
      </form>
    </section>

    <aside class="sidebar" aria-label="Checklist status">
      <div class="sidebar-title">
        <h3>Today</h3>
      </div>
      <div class="side-section">
        <div class="progress-wrap">
          <div class="progress-head">
            <span class="small" id="progressLabel">Progress</span>
            <span class="progress-pct" id="progressPct">0%</span>
          </div>
          <div class="progress-bar" aria-hidden="true">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-text" id="progressText">0 of 0 tasks complete</div>
        </div>
        <div class="notice hidden" id="readyNotice"></div>
      </div>

      <div class="side-section">
        <h3>Submission History</h3>
        <div class="history-list" id="historyList"></div>
      </div>
    </aside>
  </main>

  <script>
    const morningTasks = [
      ["Product report generated", "Generate the daily product report before fulfillment begins.", "Morning"],
      ["Inventory checked", "Review inventory against the product report.", "Morning"],
      ["Products needed added to PK to-do list", "Add all needed products to the PK to-do list.", "Morning"],
      ["Kirby Machine 1 calibration verified", "Verify Kirby Machine 1 counts 30 tablets without issues.", "Calibration"],
      ["Kirby Machine 2 calibration verified", "Verify Kirby Machine 2 counts 30 tablets without issues.", "Calibration"],
      ["Kirby Machine 3 calibration verified", "Verify Kirby Machine 3 counts 30 tablets without issues.", "Calibration"],
      ["Kirby Machine 4 calibration verified", "Verify Kirby Machine 4 counts 30 tablets without issues.", "Calibration"]
    ];

    const cleaningTasks = [
      ["Tables Wiped", "Clean and sanitize all fulfillment work tables.", "Cleaning"],
      ["Kirby Machines Cleaned", "Wipe down and clean Kirby machines before use.", "Cleaning"],
      ["Vials", "Verify vial supply is restocked for the day.", "Restocking"],
      ["Caps", "Verify cap supply is restocked for the day.", "Restocking"],
      ["Commercial Products", "Verify commercial products are restocked, including Ondansetron, Metformin, etc.", "Restocking"]
    ];

    if (new Date().getDay() === 5) {
      cleaningTasks.push([
        "Expired Compounds Checked",
        "Check and verify expired compounds have been reviewed.",
        "Friday Check"
      ]);
    }

    const form = document.getElementById("checklistForm");
    const allTaskIds = [];
    let activeChecklist = "morning";
    const fixedStation = "Fulfillment";
    const defaultSlackRelayUrl = "https://script.google.com/macros/s/AKfycbw2krNXGlWZYYNlRJcID2C60ZwwgZ3556MDMdcayfcGm6SGApVNNmQu2g782FhJz_Oq8A/exec";
    const checklistLabels = {
      morning: "Morning Product Checklist",
      cleaning: "End-of-Day Cleaning"
    };
    const storageKeys = {
      draft: "fulfillment-checklist-draft",
      history: "fulfillment-checklist-history"
    };

    function taskId(group, index) {
      return `${group}-${index}`;
    }

    function renderTasks(containerId, tasks, group) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      tasks.forEach(([title, detail, category], index) => {
        const id = taskId(group, index);
        allTaskIds.push(id);
        const row = document.createElement("label");
        row.className = "task";
        row.htmlFor = id;
        row.innerHTML = `
          <input type="checkbox" id="${id}" data-group="${group}" data-title="${escapeHtml(title)}" data-category="${escapeHtml(category || "")}">
          <span class="task-body">
            <span class="task-title">${escapeHtml(title)}</span>
            <span class="task-detail">${category ? `<span class="task-cat">${escapeHtml(category)}</span>` : ""}${escapeHtml(detail)}</span>
          </span>
          <span class="status-pill">Pending</span>
        `;
        container.appendChild(row);
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("clockDate").textContent = now.toLocaleDateString([], {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });
      document.getElementById("clockTime").textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        timeZoneName: "short"
      });
    }

    function getCheckedIds() {
      return allTaskIds.filter((id) => document.getElementById(id).checked);
    }

    function getActiveTaskIds() {
      return allTaskIds.filter((id) => document.getElementById(id).dataset.group === activeChecklist);
    }

    function updateProgress() {
      const activeTaskIds = getActiveTaskIds();
      const checked = activeTaskIds.filter((id) => document.getElementById(id).checked);
      const percent = activeTaskIds.length ? Math.round((checked.length / activeTaskIds.length) * 100) : 0;
      document.getElementById("progressFill").style.width = `${percent}%`;
      document.getElementById("progressPct").textContent = `${percent}%`;
      document.getElementById("progressText").textContent = `${checked.length} of ${activeTaskIds.length} ${checklistLabels[activeChecklist].toLowerCase()} tasks complete`;
      document.getElementById("morningCount").textContent = `${countGroup("morning")} of ${morningTasks.length} complete`;
      document.getElementById("cleaningCount").textContent = `${countGroup("cleaning")} of ${cleaningTasks.length} complete`;

      allTaskIds.forEach((id) => {
        const checkbox = document.getElementById(id);
        const row = checkbox.closest(".task");
        const status = row.querySelector(".status-pill");
        row.classList.toggle("done", checkbox.checked);
        status.textContent = checkbox.checked ? "Done" : "Pending";
      });

      const readyNotice = document.getElementById("readyNotice");
      readyNotice.classList.remove("hidden");
      if (checked.length === activeTaskIds.length) {
        readyNotice.className = "notice success";
        readyNotice.textContent = `All ${checklistLabels[activeChecklist].toLowerCase()} items are complete and ready to submit.`;
      } else {
        readyNotice.className = "notice";
        readyNotice.textContent = `Submission is allowed only after every visible ${checklistLabels[activeChecklist].toLowerCase()} item is complete.`;
      }
    }

    function countGroup(group) {
      return allTaskIds.filter((id) => id.startsWith(group) && document.getElementById(id).checked).length;
    }

    function getFormPayload() {
      const now = new Date();
      enforceFixedStation();
      const tasks = getActiveTaskIds().map((id) => {
        const checkbox = document.getElementById(id);
        return {
          title: checkbox.dataset.title,
          group: checkbox.dataset.group,
          category: checkbox.dataset.category,
          complete: checkbox.checked
        };
      });

      return {
        checklistType: activeChecklist,
        checklistTitle: checklistLabels[activeChecklist],
        submittedAt: now.toISOString(),
        submittedAtLocal: now.toLocaleString([], { timeZoneName: "short" }),
        teamMember: document.getElementById("teamMember").value.trim(),
        station: fixedStation,
        shift: activeChecklist === "morning" ? "Morning" : "Closing",
        location: fixedStation,
        notes: document.getElementById("notes").value.trim(),
        tasks,
        completeCount: tasks.filter((task) => task.complete).length,
        totalCount: tasks.length
      };
    }

    function saveDraft() {
      enforceFixedStation();
      const draft = {
        teamMember: document.getElementById("teamMember").value,
        station: fixedStation,
        shift: document.getElementById("shift").value,
        notes: document.getElementById("notes").value,
        checked: getCheckedIds()
      };
      localStorage.setItem(storageKeys.draft, JSON.stringify(draft));
    }

    function loadDraft() {
      const raw = localStorage.getItem(storageKeys.draft);
      if (!raw) return;
      try {
        const draft = JSON.parse(raw);
        document.getElementById("teamMember").value = draft.teamMember || "";
        enforceFixedStation();
        document.getElementById("shift").value = draft.shift || "Morning";
        document.getElementById("notes").value = draft.notes || "";
        (draft.checked || []).forEach((id) => {
          if (document.getElementById(id)) document.getElementById(id).checked = true;
        });
      } catch {
        localStorage.removeItem(storageKeys.draft);
      }
      enforceFixedStation();
    }

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(storageKeys.history)) || [];
      } catch {
        return [];
      }
    }

    function saveHistory(payload, deliveryStatus) {
      const history = getHistory();
      history.unshift({
        ...payload,
        deliveryStatus
      });
      localStorage.setItem(storageKeys.history, JSON.stringify(history.slice(0, 60)));
      renderHistory();
    }

    function renderHistory() {
      const history = getHistory();
      const list = document.getElementById("historyList");
      if (!history.length) {
        list.innerHTML = `<div class="small">No submissions saved on this computer yet.</div>`;
        return;
      }
      list.innerHTML = history.map((item) => `
        <div class="history-item">
          <strong>${escapeHtml(item.submittedAtLocal)}</strong>
          ${escapeHtml(item.checklistTitle || "Checklist")} &middot; ${escapeHtml(item.teamMember || "Unknown")}<br>
          ${escapeHtml(item.station || "No station")}<br>
          ${escapeHtml(item.completeCount)}/${escapeHtml(item.totalCount)} complete &middot; ${escapeHtml(item.deliveryStatus)}
        </div>
      `).join("");
    }

    function resetForm() {
      form.reset();
      enforceFixedStation();
      document.getElementById("shift").value = activeChecklist === "morning" ? "Morning" : "Closing";
      getActiveTaskIds().forEach((id) => {
        document.getElementById(id).checked = false;
      });
      localStorage.removeItem(storageKeys.draft);
      updateProgress();
    }

    async function submitChecklist(event) {
      event.preventDefault();
      const payload = getFormPayload();
      if (!payload.teamMember || !payload.station || !payload.shift) {
        form.reportValidity();
        return;
      }
      if (payload.completeCount !== payload.totalCount) {
        showTemporaryNotice(`Finish every ${checklistLabels[activeChecklist].toLowerCase()} item before submitting.`, false);
        return;
      }

      const relayUrl = getSlackRelayUrl();
      let deliveryStatus = "Saved locally only";
      if (relayUrl) {
        try {
          await fetch(relayUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          });
          deliveryStatus = "Sent to Slack";
        } catch (error) {
          deliveryStatus = `Slack send failed: ${error.message}`;
        }
      }

      saveHistory(payload, deliveryStatus);
      clearSubmittedChecklist();
      showTemporaryNotice(deliveryStatus, deliveryStatus === "Sent to Slack");
    }

    function clearSubmittedChecklist() {
      getActiveTaskIds().forEach((id) => {
        document.getElementById(id).checked = false;
      });
      document.getElementById("notes").value = "";
      localStorage.removeItem(storageKeys.draft);
      updateProgress();
    }

    function showTemporaryNotice(message, success) {
      const readyNotice = document.getElementById("readyNotice");
      readyNotice.classList.remove("hidden");
      readyNotice.className = success ? "notice success" : "notice";
      readyNotice.textContent = message;
      window.setTimeout(updateProgress, 4500);
    }

    function switchChecklist(nextChecklist) {
      activeChecklist = nextChecklist;
      document.querySelectorAll(".tab-button").forEach((button) => {
        const isActive = button.dataset.checklist === activeChecklist;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-selected", String(isActive));
      });
      document.querySelectorAll("[data-checklist-section]").forEach((section) => {
        section.classList.toggle("hidden", section.dataset.checklistSection !== activeChecklist);
      });
      document.getElementById("shift").value = activeChecklist === "morning" ? "Morning" : "Closing";
      document.getElementById("submitButton").textContent = `Submit ${checklistLabels[activeChecklist]}`;
      updateProgress();
      saveDraft();
    }

    function enforceFixedStation() {
      document.getElementById("station").value = fixedStation;
    }

    function getSlackRelayUrl() {
      return defaultSlackRelayUrl;
    }

    renderTasks("morningTasks", morningTasks, "morning");
    renderTasks("cleaningTasks", cleaningTasks, "cleaning");
    loadDraft();
    enforceFixedStation();
    renderHistory();
    updateClock();
    updateProgress();
    window.setInterval(updateClock, 1000);
    form.addEventListener("change", () => {
      updateProgress();
      saveDraft();
    });
    form.addEventListener("input", saveDraft);
    form.addEventListener("submit", submitChecklist);
    document.getElementById("saveDraftButton").addEventListener("click", () => {
      saveDraft();
      showTemporaryNotice("Draft saved on this computer.", true);
    });
    document.getElementById("resetButton").addEventListener("click", resetForm);
    document.getElementById("morningTab").addEventListener("click", () => switchChecklist("morning"));
    document.getElementById("cleaningTab").addEventListener("click", () => switchChecklist("cleaning"));
  </script>
</body>
</html>
